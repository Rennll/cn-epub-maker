name: test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - name: Install Pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: "3.8"
      - name: Install EPUBCheck
        run: |
          curl -fsSL -o /tmp/epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
          unzip -q /tmp/epubcheck.zip -d /opt
          test -f /opt/epubcheck-5.3.0/epubcheck.jar
          printf '#!/usr/bin/env bash\nexec java -jar /opt/epubcheck-5.3.0/epubcheck.jar "$@"\n' > /usr/local/bin/epubcheck
          chmod +x /usr/local/bin/epubcheck
          epubcheck --version
      - id: pytest
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee /tmp/pytest.log
      - id: build
        name: Build real-reader acceptance EPUB
        run: |
          python -m novel_epub.cli build tests/fixtures/real_reader_acceptance.txt \
            --title "Real Reader Acceptance Baseline" \
            --author "測試作者" \
            --lang "zh-TW" \
            --output /tmp/real-reader-acceptance.epub
          python -m novel_epub.cli validate --require-epubcheck /tmp/real-reader-acceptance.epub 2>&1 | tee /tmp/build.log
      - name: Upload real-reader acceptance EPUB
        uses: actions/upload-artifact@v4
        with:
          name: real-reader-acceptance-epub
          path: /tmp/real-reader-acceptance.epub
          if-no-files-found: error
      - id: policy
        name: Verify strict EPUBCheck CLI path
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          path = Path("/tmp/epubcheck-policy.epub")
          container = '''<?xml version="1.0" encoding="UTF-8"?>
          <container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">
            <rootfiles><rootfile full-path="EPUB/content.opf" media-type="application/oebps-package+xml" /></rootfiles>
          </container>
          '''
          opf = '''<?xml version="1.0" encoding="UTF-8"?>
          <package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="pub-id">
            <metadata xmlns:dc="http://purl.org/dc/elements/1.1/">
              <dc:identifier id="pub-id">urn:uuid:12345678-1234-4123-8123-1234567890ab</dc:identifier>
              <dc:title>EPUBCheck Policy Test</dc:title>
              <dc:language>zh-TW</dc:language>
              <meta property="dcterms:modified">2026-01-01T00:00:00Z</meta>
            </metadata>
            <manifest>
              <item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav" />
              <item id="ch1" href="text/ch000001.xhtml" media-type="application/xhtml+xml" />
            </manifest>
            <spine><itemref idref="ch1" /></spine>
          </package>
          '''
          nav = '''<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops">
            <head><title>EPUBCheck Policy Test</title></head>
            <body><nav epub:type="toc"><ol><li><a href="text/ch000001.xhtml">Chapter</a></li></ol></nav></body>
          </html>
          '''
          chapter = '''<html xmlns="http://www.w3.org/1999/xhtml"><head><title>Chapter</title></head><body><h1>Chapter</h1><p>Test.</p></body></html>'''
          with ZipFile(path, "w") as zf:
              zf.writestr("mimetype", "application/epub+zip", compress_type=0)
              zf.writestr("META-INF/container.xml", container)
              zf.writestr("EPUB/content.opf", opf)
              zf.writestr("EPUB/nav.xhtml", nav)
              zf.writestr("EPUB/text/ch000001.xhtml", chapter)
          PY
          python -m novel_epub.cli validate --require-epubcheck /tmp/epubcheck-policy.epub 2>&1 | tee /tmp/policy.log

      - name: Telegram - Success
        if: success()
        continue-on-error: true
        uses: Rennll/ai-collaboration/github-actions/telegram-ci@main
        with:
          status: success
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Telegram - Failure
        if: failure()
        continue-on-error: true
        uses: Rennll/ai-collaboration/github-actions/telegram-ci@main
        with:
          status: failure
          failed-step: ${{ steps.pytest.outcome == 'failure' && 'pytest' || steps.build.outcome == 'failure' && 'build/validate' || steps.policy.outcome == 'failure' && 'EPUBCheck policy' || 'CI' }}
          log-file: ${{ steps.pytest.outcome == 'failure' && '/tmp/pytest.log' || steps.build.outcome == 'failure' && '/tmp/build.log' || steps.policy.outcome == 'failure' && '/tmp/policy.log' || '' }}
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
