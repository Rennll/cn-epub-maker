[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-epub"
version = "0.1.0"
description = "Lossless Chinese TXT novel to EPUB converter"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
novel-epub = "novel_epub.cli:main"

[tool.setuptools]
packages = ["novel_epub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
